<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NepHR - Connection Required</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #508C7F;
            --accent-yellow: #ffeb3b;
            --text-white: #ffffff;
            --transition: all 0.3s ease;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: var(--primary-bg); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }

        #appFrame { width: 100%; height: 100%; border: none; display: block; }

        /* Modern Offline Screen */
        #offline-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-white);
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #508C7F 0%, #355d54 100%);
        }

        .icon-container {
            position: relative;
            margin-bottom: 40px;
        }

        .wifi-icon { 
            font-size: 90px; 
            opacity: 0.9; 
            animation: pulse 2s infinite ease-in-out;
        }

        .warning-icon { 
            position: absolute; bottom: -5px; right: -15px; 
            font-size: 35px; color: var(--accent-yellow);
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.2));
        }

        h1 { font-size: 32px; margin: 0 0 15px 0; font-weight: 700; letter-spacing: -0.5px; }
        p { font-size: 17px; opacity: 0.85; max-width: 320px; line-height: 1.6; margin: 0; }

        .retry-btn {
            margin-top: 50px;
            padding: 16px 50px;
            border-radius: 50px;
            border: none;
            background: white;
            color: var(--primary-bg);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .retry-btn:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .retry-btn:active { transform: translateY(-1px); }

        .status-footer {
            position: fixed;
            bottom: 40px;
            font-size: 11px;
            opacity: 0.5;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 0.7; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* Spinner */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-bg);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <!-- Main NepHR App Frame -->
    <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbxiNhgXHhhEjqZJl9epRs3u5eFR9OU290uB0Ohlc2PkxS-z71GsOFgSshGy37rc-LK5/exec" allow="geolocation; camera"></iframe>

    <!-- Attractive English Offline Screen -->
    <div id="offline-screen">
        <div class="icon-container">
            <i class="fas fa-wifi wifi-icon"></i>
            <i class="fas fa-exclamation-circle warning-icon"></i>
        </div>
        
        <h1>You are Offline</h1>
        <p>It seems you're not connected to the internet. Please check your connection to continue using NepHR.</p>
        
        <button class="retry-btn" onclick="retryConnection()">
            <span class="loader" id="loader"></span>
            <span id="btn-text">Try Again</span>
        </button>

        <div class="status-footer">Offline Mode Enabled</div>
    </div>

    <script>
        const frame = document.getElementById('appFrame');
        const offlineScreen = document.getElementById('offline-screen');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btn-text');

        // Check connectivity and switch UI
        function checkConnectivity() {
            if (navigator.onLine) {
                frame.style.display = "block";
                offlineScreen.style.display = "none";
            } else {
                frame.style.display = "none";
                offlineScreen.style.display = "flex";
            }
        }

        // Animated Retry logic
        function retryConnection() {
            btnText.innerText = "Checking...";
            loader.style.display = "block";
            
            // Artificial delay for smooth feel
            setTimeout(() => {
                if (navigator.onLine) {
                    location.reload(); 
                } else {
                    loader.style.display = "none";
                    btnText.innerText = "Try Again";
                    // Add shake effect to screen if still offline
                    offlineScreen.style.animation = "shake 0.5s ease-in-out";
                    setTimeout(() => { offlineScreen.style.animation = ""; }, 500);
                }
            }, 1200);
        }

        // Global Event Listeners
        window.addEventListener('online', checkConnectivity);
        window.addEventListener('offline', checkConnectivity);

        // Initial Check
        window.onload = checkConnectivity;

        // Register Service Worker for PWA support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('sw.js'); 
            });
        }
    </script>
</body>
</html>
