<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NepHR PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#508C7F">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #508C7F; }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background-color: var(--primary); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #gatekeeper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            color: white; text-align: center;
        }

        .logo-container { margin-bottom: 40px; }
        .logo-container img { width: 180px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2)); }

        .unlock-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 25px;
            width: 85%; max-width: 320px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .icon-circle {
            width: 80px; height: 80px; border: 3px solid white;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 20px;
            font-size: 35px; cursor: pointer;
            transition: transform 0.2s;
        }
        .icon-circle:active { transform: scale(0.9); }

        h2 { font-size: 22px; margin: 0 0 10px; font-weight: 600; }
        p { font-size: 14px; opacity: 0.8; margin: 0 0 25px 0; line-height: 1.4; }

        .btn-bypass {
            background: white; color: var(--primary);
            border: none; padding: 12px 25px; border-radius: 12px;
            font-weight: bold; font-size: 14px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%; transition: 0.2s;
        }
        .btn-bypass:active { transform: translateY(2px); }

        iframe { width: 100%; height: 100%; border: none; display: none; }
    </style>
</head>
<body>

    <div id="gatekeeper">
        <div class="logo-container">
            <!-- यहाँ तपाईँको NepHR लोगोको URL राख्नुहोला -->
            <img src="https://placehold.co/200x60/ffffff/508C7F?text=NepHR" alt="Logo">
        </div>

        <div class="unlock-card">
            <div class="icon-circle" id="bio-btn">
                <i class="fas fa-fingerprint"></i>
            </div>
            <h2 id="status-title">System Locked</h2>
            <p id="status-desc">Use Fingerprint or FaceID to access NepHR App</p>
            
            <!-- यदि बायोमेट्रिक बिग्रियो भने सिधै भित्र जाने बटन -->
            <button class="btn-bypass" onclick="loadSystem()">Login with Password</button>
        </div>
    </div>

    <iframe id="appFrame" 
            src="https://script.google.com/macros/s/AKfycbw4SHBZ_10GT-fwKkDuO57qaib40_RBa0fEzPvOumrvqUsyvSr_sJm4kWlul1AwoNk1/exec" 
            allow="geolocation; camera; publickey-credentials-get"></iframe>

    <script>
        const frame = document.getElementById('appFrame');
        const gatekeeper = document.getElementById('gatekeeper');
        const bioBtn = document.getElementById('bio-btn');

        // PWA Mode चेक गर्ने
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

        window.onload = function() {
            if (isStandalone) {
                // PWA मोडमा हुँदा मात्र लक देखाउने
                gatekeeper.style.display = 'flex';
                // एप खोल्ने बित्तिकै प्रम्प्ट देखाउन खोज्ने
                setTimeout(triggerBiometric, 500);
            } else {
                loadSystem();
            }
        };

        bioBtn.onclick = triggerBiometric;

        async function triggerBiometric() {
            if (!window.PublicKeyCredential) {
                loadSystem();
                return;
            }

            try {
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);

                // यो एउटा 'Assertion' कल हो जसले मोबाइलको पिन/फिंगरप्रिन्ट माग्छ
                const options = {
                    publicKey: {
                        challenge: challenge,
                        timeout: 60000,
                        userVerification: "required",
                        // यहाँ 'allowCredentials' खाली राख्दा यसले डिभाइसको लोकल क्रेडिन्सियल खोज्छ
                    }
                };

                // धेरैजसो एन्ड्रोइडमा 'create' ले 'get' भन्दा राम्रो काम गर्छ 'gatekeeper' को लागि
                const dummyOptions = {
                    publicKey: {
                        challenge: challenge,
                        rp: { name: "NepHR" },
                        user: { id: challenge, name: "user", displayName: "User" },
                        pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                        authenticatorSelection: { userVerification: "required" }
                    }
                };

                await navigator.credentials.create(dummyOptions);
                loadSystem();

            } catch (err) {
                console.error("Biometric failed:", err);
                document.getElementById('status-title').innerText = "Security Check";
                document.getElementById('status-desc').innerText = "Biometric was cancelled or not set up.";
                document.getElementById('status-title').style.color = "#ffbaba";
            }
        }

        function loadSystem() {
            gatekeeper.style.display = 'none';
            frame.style.display = 'block';
            
            // Iframe मा डाटा पठाउने
            const currentSrc = frame.src;
            if (!currentSrc.includes('standalone=')) {
                frame.src = currentSrc + (currentSrc.includes('?') ? '&' : '?') + 'standalone=true';
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
