<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NepHR - Connection Required</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #508C7F;
            --card-bg: rgba(255, 255, 255, 0.1);
            --text-white: #ffffff;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: var(--primary-bg); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        #appFrame { width: 100%; height: 100%; border: none; display: block; }

        /* Attractive Offline UI */
        #offline-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-white);
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #508C7F 0%, #3d6b61 100%);
        }

        .icon-box {
            position: relative;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        .main-icon { font-size: 80px; opacity: 0.9; }
        .small-icon { 
            position: absolute; bottom: 0; right: -10px; 
            font-size: 30px; color: #ffeb3b; 
        }

        h1 { font-size: 28px; margin: 10px 0; font-weight: 600; }
        p { font-size: 16px; opacity: 0.8; max-width: 300px; line-height: 1.5; }

        .retry-btn {
            margin-top: 40px;
            padding: 15px 40px;
            border-radius: 30px;
            border: none;
            background: white;
            color: var(--primary-bg);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .retry-btn:active { transform: scale(0.95); box-shadow: 0 5px 10px rgba(0,0,0,0.2); }

        .connection-status {
            position: fixed;
            bottom: 30px;
            font-size: 12px;
            opacity: 0.6;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        /* Loading Spinner for Retry */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-bg);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <!-- Main NepHR Application -->
    <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbxiNhgXHhhEjqZJl9epRs3u5eFR9OU290uB0Ohlc2PkxS-z71GsOFgSshGy37rc-LK5/exec" allow="geolocation; camera"></iframe>

    <!-- Beautiful Offline Screen -->
    <div id="offline-screen">
        <div class="icon-box">
            <i class="fas fa-wifi main-icon"></i>
            <i class="fas fa-exclamation-triangle small-icon"></i>
        </div>
        <h1>तपाईं अफलाइन हुनुहुन्छ</h1>
        <p>NepHR चलाउन इन्टरनेट जडान आवश्यक छ। कृपया आफ्नो वाइफाइ वा डाटा चेक गर्नुहोस्।</p>
        
        <button class="retry-btn" onclick="retryConnection()">
            <span class="loader" id="loader"></span>
            <span id="btn-text">फेरि प्रयास गर्नुहोस्</span>
        </button>

        <div class="connection-status">No Internet Connection</div>
    </div>

    <script>
        const frame = document.getElementById('appFrame');
        const offlineScreen = document.getElementById('offline-screen');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btn-text');

        // कनेक्सन चेक गर्ने फङ्सन
        function checkConnectivity() {
            if (navigator.onLine) {
                frame.style.display = "block";
                offlineScreen.style.display = "none";
            } else {
                frame.style.display = "none";
                offlineScreen.style.display = "flex";
            }
        }

        // Retry बटन थिच्दाको लजिक
        function retryConnection() {
            btnText.innerText = "जाँच गर्दै...";
            loader.style.display = "block";
            
            setTimeout(() => {
                if (navigator.onLine) {
                    location.reload(); // अनलाइन भए पेज रिलोड गर्ने
                } else {
                    loader.style.display = "none";
                    btnText.innerText = "फेरि प्रयास गर्नुहोस्";
                    // एउटा सानो बम्प एनिमेसन दिने
                    offlineScreen.style.animation = "none";
                    void offlineScreen.offsetWidth; 
                    offlineScreen.style.animation = "shake 0.5s";
                }
            }, 1500);
        }

        // ब्राउजरको अनलाइन/अफलाइन इभेन्ट सुन्ने
        window.addEventListener('online', checkConnectivity);
        window.addEventListener('offline', checkConnectivity);

        // सुरुमा एकपटक चेक गर्ने
        window.onload = checkConnectivity;

        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('sw.js'); 
            });
        }
    </script>

    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</body>
</html>
